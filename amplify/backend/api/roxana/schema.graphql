# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

type Discussion @model {
  id: ID!
  version: Int!    # == 2
  revision: Int    # incremented on every update
  layout: String!
  goalsSummary: String
  analysisResults: String
  isPrivate: Boolean!
  inviteCode: String @index(name: "byInviteCode", queryField: "queryDiscussionsByInviteCode")
  sentences: [Sentence!] @hasMany(indexName: "byDiscussion", fields: ["id"])
  userDiscussions: [UserDiscussion!] @hasMany(indexName: "byDiscussion", fields: ["id"])
  pool: Int! @index(name: "byPool", queryField: "queryDiscussionsByPool", sortKeyFields: ["updatedAt"]) # == 1
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type Sentence @model {
  id: ID!
  content: String!  # immutable
  searchable: String
  discussionId: ID @index(name: "byDiscussion")
  discussion: Discussion @belongsTo(fields: ["discussionId"])
}

type User @model {
  username: ID! @primaryKey
  userDiscussions: [UserDiscussion!] @hasMany(indexName: "byUser", fields: ["username"])
}

type Subscription {
  onDiscussionById(id: ID!): Discussion
    @aws_subscribe(mutations: ["updateDiscussion"])
}

type UserDiscussion @model {
  id: ID!
  discussionId: ID @index(name: "byDiscussion", queryField: "queryUserDiscussionByDiscussionId")
  discussion: Discussion @belongsTo(fields: ["discussionId"])
  userId: ID @index(name: "byUser", queryField: "queryUserDiscussionsByUserId", sortKeyFields: ["updatedAt"])
  user: User @belongsTo(fields: ["userId"])
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}
